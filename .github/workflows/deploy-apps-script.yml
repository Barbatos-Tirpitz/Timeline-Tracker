name: Deploy Apps Script

on:
  push:
    branches:
      - main
      - v.9
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-script-production-deployment
  cancel-in-progress: false

jobs:
  test-and-deploy:
    if: github.ref_name == 'main' || github.ref_name == 'v.9'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run regression tests
        run: node --test tests/task-tracker.test.cjs

      - name: Install clasp
        run: npm install --global @google/clasp@3.4.1

      - name: Preserve repository source
        run: |
          mkdir -p "$RUNNER_TEMP/timeline-tracker-source"
          mkdir -p "$RUNNER_TEMP/timeline-tracker-clasp"
          cp App.html code.gs "$RUNNER_TEMP/timeline-tracker-source/"

      - name: Configure clasp credentials and project
        env:
          CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        run: |
          if [ -z "$CLASP_CREDENTIALS" ] || [ -z "$APPS_SCRIPT_ID" ]; then
            echo "Required GitHub Secrets are missing: CLASP_CREDENTIALS and APPS_SCRIPT_ID."
            exit 1
          fi
          printf '%s' "$CLASP_CREDENTIALS" > "$HOME/.clasprc.json"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$APPS_SCRIPT_ID" > "$RUNNER_TEMP/timeline-tracker-clasp/.clasp.json"

      - name: Pull current Apps Script project metadata
        working-directory: ${{ runner.temp }}/timeline-tracker-clasp
        run: clasp pull

      - name: Overlay repository source
        working-directory: ${{ runner.temp }}/timeline-tracker-clasp
        run: |
          find . -maxdepth 1 -type f \( -iname 'App.*' -o -iname 'Code.*' \) -print -delete
          cp "$RUNNER_TEMP/timeline-tracker-source/"* .
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const supported = /\.(gs|js|ts|html|json)$/i;
          const files = [];
          function walk(directory, relative = '') {
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              if (entry.name === '.clasp.json') continue;
              const next = path.join(relative, entry.name);
              const full = path.join(directory, entry.name);
              if (entry.isDirectory()) walk(full, next);
              else if (supported.test(entry.name)) files.push(next);
            }
          }
          walk('.');
          const groups = new Map();
          for (const file of files) {
            const parsed = path.parse(file);
            const key = path.join(parsed.dir, parsed.name).toLowerCase();
            groups.set(key, [...(groups.get(key) || []), file]);
          }
          const conflicts = [...groups.values()].filter(group => group.length > 1);
          if (conflicts.length) {
            console.error('Apps Script filename conflicts remain after overlay:');
            for (const group of conflicts) console.error(' - ' + group.join(' <-> '));
            process.exit(1);
          }
          NODE

      - name: Push source to Apps Script
        working-directory: ${{ runner.temp }}/timeline-tracker-clasp
        run: clasp push

      - name: Update existing web-app deployment
        working-directory: ${{ runner.temp }}/timeline-tracker-clasp
        env:
          APPS_SCRIPT_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
        run: |
          if [ -z "$APPS_SCRIPT_DEPLOYMENT_ID" ]; then
            echo "Required GitHub Secret is missing: APPS_SCRIPT_DEPLOYMENT_ID."
            exit 1
          fi
          clasp create-deployment --deploymentId "$APPS_SCRIPT_DEPLOYMENT_ID" --description "GitHub ${GITHUB_SHA}"

      - name: Remove temporary clasp credentials
        if: always()
        run: rm -rf "$HOME/.clasprc.json" "$RUNNER_TEMP/timeline-tracker-clasp"
